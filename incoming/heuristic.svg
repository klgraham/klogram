<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340" role="img" aria-labelledby="title desc">
  <title id="title">Diversity heuristic versus nearest-M</title>
  <desc id="desc">Query at angle 0. Candidates at 5, 6, and -30 degrees. Nearest-2 keeps the two tight neighbors. Alg. 4 keeps the near neighbor and the opposite-side one.</desc>
  <style>
    .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; fill: #222; }
    .small { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; fill: #555; }
    .axis { stroke: #ccc; fill: none; }
    .ray { stroke-width: 1.5; }
  </style>
  <rect width="640" height="340" fill="#fafafa"/>

  <!-- left: nearest-M -->
  <text class="label" x="40" y="28">nearest-2 (Alg. 3 in the paper)</text>
  <circle cx="160" cy="180" r="90" fill="none" stroke="#ddd"/>
  <line class="axis" x1="70" y1="180" x2="250" y2="180"/>
  <line class="axis" x1="160" y1="90" x2="160" y2="270"/>
  <line class="ray" x1="160" y1="180" x2="250" y2="180" stroke="#c0392b"/>
  <line class="ray" x1="160" y1="180" x2="249" y2="172" stroke="#1f4e79"/>
  <line class="ray" x1="160" y1="180" x2="249" y2="170.6" stroke="#1f4e79"/>
  <line class="ray" x1="160" y1="180" x2="238" y2="225" stroke="#bbb" stroke-dasharray="4 3"/>
  <circle cx="250" cy="180" r="4" fill="#c0392b"/>
  <circle cx="249" cy="172" r="5" fill="#1f4e79"/>
  <circle cx="249" cy="170.6" r="5" fill="#1f4e79"/>
  <circle cx="238" cy="225" r="4" fill="#bbb"/>
  <text class="small" x="256" y="184">q</text>
  <text class="small" x="40" y="300">keeps A (5°) and B (6°)</text>

  <!-- right: heuristic -->
  <text class="label" x="360" y="28">select_neighbors_heuristic, max=2</text>
  <circle cx="480" cy="180" r="90" fill="none" stroke="#ddd"/>
  <line class="axis" x1="390" y1="180" x2="570" y2="180"/>
  <line class="axis" x1="480" y1="90" x2="480" y2="270"/>
  <line class="ray" x1="480" y1="180" x2="570" y2="180" stroke="#c0392b"/>
  <line class="ray" x1="480" y1="180" x2="569" y2="172" stroke="#1f4e79"/>
  <line class="ray" x1="480" y1="180" x2="569" y2="170.6" stroke="#bbb" stroke-dasharray="4 3"/>
  <line class="ray" x1="480" y1="180" x2="558" y2="225" stroke="#1f4e79"/>
  <circle cx="570" cy="180" r="4" fill="#c0392b"/>
  <circle cx="569" cy="172" r="5" fill="#1f4e79"/>
  <circle cx="569" cy="170.6" r="4" fill="#bbb"/>
  <circle cx="558" cy="225" r="5" fill="#1f4e79"/>
  <text class="small" x="576" y="184">q</text>
  <text class="small" x="360" y="300">keeps A (5°) and C (−30°); B is closer to A than to q</text>
</svg>
